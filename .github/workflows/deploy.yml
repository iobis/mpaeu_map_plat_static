# Deploys the frontend only (a static bundle) — raster tiles now come from a
# titiler backend that must be hosted separately (e.g. the docker-compose.yml
# / Dockerfile in this repo, run on any container host). Set BASE_PATH and
# PUBLIC_TITILER_URL as plain *repository* variables (Settings > Secrets and
# variables > Actions > Variables tab — not under any Environment) before
# relying on this workflow; both otherwise fall back to a localhost default,
# which will not work for visitors.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/mpaeu_map_plat_static' }}
          PUBLIC_TITILER_URL: ${{ vars.PUBLIC_TITILER_URL || 'http://localhost:8000' }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
