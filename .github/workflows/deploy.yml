# Deploys the frontend only (a static bundle) — raster tiles now come from a
# titiler backend that must be hosted separately (e.g. the docker-compose.yml
# / Dockerfile in this repo, run on any container host). Set BASE_PATH and
# PUBLIC_TITILER_URL as Variables on the `github-pages` environment (Settings
# > Environments > github-pages > Environment variables) — the `environment:`
# key below is what makes `vars.*` resolve against that environment's
# variables rather than only repository-level ones; without it, both would
# silently fall back to their defaults (localhost) no matter what's set there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/mpaeu_map_plat_static' }}
          PUBLIC_TITILER_URL: ${{ vars.PUBLIC_TITILER_URL || 'http://localhost:8000' }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
