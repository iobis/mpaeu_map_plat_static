server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Every route is prerendered (trailingSlash='always'), so this is plain
	# static file serving — /compare/ resolves directly to
	# /compare/index.html. The 404.html fallback only matters for genuinely
	# unknown paths.
	location / {
		try_files $uri $uri/ /404.html;
	}

	location = /404.html {
		internal;
	}
}
